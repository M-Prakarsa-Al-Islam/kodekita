<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" fill="#F3F5F5"/>
  <rect x="10" y="10" width="280" height="280" fill="white" stroke="#171B24" stroke-width="2"/>
  <text x="150" y="40" font-family="monospace" font-size="14" fill="#171B24" text-anchor="middle" font-weight="bold">QRIS</text>

  <!-- fake finder-pattern corners, just to read as "a QR code" -->
  <g fill="#171B24">
    <rect x="30" y="60" width="50" height="50"/>
    <rect x="42" y="72" width="26" height="26" fill="white"/>
    <rect x="220" y="60" width="50" height="50"/>
    <rect x="232" y="72" width="26" height="26" fill="white"/>
    <rect x="30" y="210" width="50" height="50"/>
    <rect x="42" y="222" width="26" height="26" fill="white"/>
  </g>

  <!-- fake noise pattern in the middle -->
  <g fill="#171B24" opacity="0.85">
    <rect x="100" y="70" width="10" height="10"/><rect x="120" y="70" width="10" height="10"/>
    <rect x="140" y="80" width="10" height="10"/><rect x="160" y="70" width="10" height="10"/>
    <rect x="180" y="90" width="10" height="10"/><rect x="100" y="100" width="10" height="10"/>
    <rect x="130" y="110" width="10" height="10"/><rect x="150" y="100" width="10" height="10"/>
    <rect x="170" y="120" width="10" height="10"/><rect x="100" y="140" width="10" height="10"/>
    <rect x="120" y="150" width="10" height="10"/><rect x="150" y="150" width="10" height="10"/>
    <rect x="180" y="140" width="10" height="10"/><rect x="200" y="160" width="10" height="10"/>
    <rect x="110" y="170" width="10" height="10"/><rect x="140" y="180" width="10" height="10"/>
    <rect x="160" y="170" width="10" height="10"/><rect x="200" y="190" width="10" height="10"/>
  </g>

  <rect x="10" y="255" width="280" height="35" fill="#F2A93B"/>
  <text x="150" y="272" font-family="monospace" font-size="11" fill="#171B24" text-anchor="middle" font-weight="bold">
    GANTI DENGAN QRIS ASLI
  </text>
  <text x="150" y="285" font-family="monospace" font-size="9" fill="#171B24" text-anchor="middle">
    public/qris-placeholder.svg
  </text>
</svg>
